{% extends "layout.html" %}

{% block title %}Uusi arvostelu{% endblock %}

{% block content %}
  <h1>Uusi arvostelu</h1>
<form action="/create_item" method="post">
  <p>
    <label for = "title">Elokuvan otsikko:</label> <br />
    <input type="text" name="title" id = "title" maxlength = "50" required/>
  </p>

  <p>
    <label for = "review">Arvostelun teksti: </label><br />
    <textarea name = "review" id = "review" rows = "8" cols = "46" maxlength = "1500" required></textarea>
    </p>
  {% for class in classes %}
  <p>
    <label for = "class"{{ class }}>{{ class }}: </label><br />
    <select name="classes" id = "class"{{ class }}>
      <option value=""></option>
    {% for option in classes[class] %}
      <option value="{{ class }}: {{ option }}">{{ option }}</option>
    {% endfor %}
    </select>
  </p>
  {% endfor %}
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Luo arvostelu" />
</form>
{% endblock %}

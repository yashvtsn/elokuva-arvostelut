<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - Elokuva-arvostelut</title>
  <link rel="stylesheet" href="/static/main.css">
</head>

<body>
  <header>
    <h1><a href="/">Elokuva-arvostelut</a></h1>
  </header>

  <nav>
    <a href="/">Etusivu</a>
    <a href="/find_item">Etsi arvostelu</a>
    {% if session.user_id %}
      <a href="/new_item">Uusi arvostelu</a>
      <a href="/user/{{ session.user_id }}">Omat tiedot ({{ session.username }})</a>
      <a href="/logout">Kirjaudu ulos</a>
    {% else %}
      <a href="/login">Kirjaudu sisään</a>
      <a href="/register">Luo tunnus</a>
    {% endif %}
  </nav>

  {% for message in get_flashed_messages() %}
    <div class="info">{{ message }}</div>
  {% endfor %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>

</html>

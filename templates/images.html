
{% extends "layout.html" %}

{% block title %}Arvostelun kuvat{% endblock %}

{% block content %}
<h1>Arvostelun kuvat</h1>

<p>Arvostelussa on {{ images | count }} kuvaa</p>
<form action="/remove_image" method="post">
    {% for image in images %}
        <p>
            <input type="checkbox" name="image_id" value="{{ image.id }}">
            <img src="/image/{{ image.id }}" alt="Arvostelun kuva" width="300">
        </p>
    {% endfor %}

    <input type="hidden" name="review_id" value="{{ review.id }}">

    <p>
        <input type="submit" value="Poista valitut kuvat">
    </p>
</form>

<p>
    <a href="/item/{{ review.id }}">Takaisin arvosteluun</a>
</p>
<p>
Lisää kuvia arvosteluun:
</p>

<form action="/add_image" method="post" enctype="multipart/form-data">
<p>
    Valitse kuva: <br />
    <input type="file" name="image" accept=".jpg" required />
</p>

<input type="hidden" name="review_id" value="{{ review.id }}" />
<input type="submit" value="Lisää kuva" />
</form>
{% endblock %}
